name: TugasScroll CI (Build APK & AAB)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_android:
    name: Analyze, Test & Build APK/AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform files if missing
        run: |
          flutter config --no-analytics
          mkdir -p assets/fonts assets/audio
          touch assets/fonts/.gitkeep assets/audio/.gitkeep
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org id.tugasscroll --project-name tugasscroll .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Debug & Release APK (Siap Install di HP)
        run: |
          flutter build apk --debug
          flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tugasscroll-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

name: TugasScroll CI (Build APK & AAB)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_android:
    name: Analyze, Test & Build APK/AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Generate Android platform files if missing
        run: |
          flutter config --no-analytics
          mkdir -p assets/fonts assets/audio
          touch assets/fonts/.gitkeep assets/audio/.gitkeep
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org id.tugasscroll --project-name tugasscroll .
            rm -f test/widget_test.dart
          fi
          python3 - << 'EOF'
          import os, re
          for p in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(p):
                  with open(p, "r") as f:
                      c = f.read()
                  c = re.sub(r"minSdk\s*=\s*flutter\.minSdkVersion", "minSdk = 26", c)
                  c = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 26", c)
                  c = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 35", c)
                  c = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 35", c)
                  if "coreLibraryDesugaring" not in c:
                      if p.endswith(".kts"):
                          c = c.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
                          c += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
                      else:
                          c = c.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
                          c += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
                  with open(p, "w") as f:
                      f.write(c)
                  print(f"Patched {p}:")
                  print(c)
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  m = f.read()
              if "android.permission.CAMERA" not in m:
                  perms = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n"""
                  m = m.replace("<application", perms + "    <application", 1)
                  with open(manifest_path, "w") as f:
                      f.write(m)
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Debug & Release APK (Siap Install di HP)
        run: |
          flutter build apk --debug
          flutter build apk --release --no-shrink --obfuscate --split-debug-info=build/symbols

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tugasscroll-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

name: TugasScroll CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  analyze_and_test:
    name: Analyze, Test & Build AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting and lints
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Release AppBundle (Obfuscated)
        if: github.ref == 'refs/heads/main'
        run: |
          flutter config --no-analytics
          # Jika direktori platform android belum digenerate di repo, buat otomatis saat CI berjalan:
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org id.tugasscroll .
          fi
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

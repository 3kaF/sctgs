name: tugasscroll
description: Aplikasi belajar scroll vertikal berkonsep halaman buku tulis dari tugas sekolah yang sudah selesai.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Local Database (Offline-First) & Storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.0

  # UI, Typography, Icons & Math Rendering
  phosphor_flutter: ^2.1.0
  flutter_math_fork: ^0.7.2
  intl: ^0.19.0

  # Camera, Image Compression & Offline OCR Fallback
  image_picker: ^1.1.2
  cunning_document_scanner: ^1.2.3
  flutter_image_compress: ^2.3.0
  google_mlkit_text_recognition: ^0.13.0

  # Audio & Notifications
  just_audio: ^0.9.38
  audio_service: ^0.18.13
  audio_session: ^0.1.21
  flutter_local_notifications: ^17.2.1

  # Network & Backend (Supabase Edge Functions)
  http: ^1.2.1
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/fonts/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-Medium.ttf
          weight: 500
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700


